name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DOCUFLOW_TEST_ADMIN_URL: postgresql://postgres:ci-only-password@localhost:5432/postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy
      - name: Module boundaries
        run: lint-imports
      - name: Tests
        run: pytest --cov=docuflow --cov-report=term-missing
      - name: Dependency vulnerabilities
        run: pip-audit --skip-editable
      - name: Licence policy
        run: python scripts/check_licences.py

  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Generate test environment
        run: scripts/ci-env.sh > .env
      - name: Start stack from clean
        run: docker compose --env-file .env -f deploy/compose.yaml up --build --detach --wait --wait-timeout 300
      - name: Readiness
        run: curl --fail --silent --show-error http://127.0.0.1:8000/health/ready
      - name: Logs on failure
        if: failure()
        run: docker compose --env-file .env -f deploy/compose.yaml logs --tail=100
