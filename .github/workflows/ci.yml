name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DOCUFLOW_TEST_ADMIN_URL: postgresql://postgres:ci-only-password@localhost:5432/postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy
      - name: Module boundaries
        run: lint-imports
      - name: Tests
        run: pytest --timeout=120 --cov=docuflow --cov-report=term-missing
      - name: Dependency vulnerabilities
        run: pip-audit --skip-editable
      - name: Licence policy
        run: python scripts/check_licences.py

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci --no-audit --no-fund
      - name: Types
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Generated API types match the backend
        run: |
          pip install -e ../backend
          PYTHON=python node scripts/gen-api.mjs
          git diff --exit-code -- src/api/schema.d.ts
      - name: Dependency vulnerabilities
        run: npm audit --audit-level=high --omit=dev

  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      COMPOSE: docker compose --env-file .env -f deploy/compose.yaml -f deploy/compose.ci.yaml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate test environment
        run: sh scripts/ci-env.sh > .env
      - name: Start stack from clean
        run: $COMPOSE up --build --detach
      - name: Wait for readiness
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/health/ready; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Web client and proxy
        run: |
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8080/ > /dev/null && break
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1:8080/ | grep -q "<div id=\"root\">"
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/api/v1/auth/me)
          test "$code" = "401"
          curl --silent --head http://127.0.0.1:8080/ | grep -i "content-security-policy"
          curl --silent --head http://127.0.0.1:8080/files/anything | grep -i "200"
      - name: Live job through Redis and Celery
        timeout-minutes: 4
        run: sh scripts/ci-live-job.sh
      - name: S3 conformance on the real backend
        timeout-minutes: 6
        working-directory: backend
        run: |
          pip install -e ".[dev]"
          set -a; . ../.env; set +a
          export DOCUFLOW_TEST_S3_ENDPOINT=http://127.0.0.1:8333
          export DOCUFLOW_TEST_S3_ACCESS_KEY=$DOCUFLOW_S3_ACCESS_KEY
          export DOCUFLOW_TEST_S3_SECRET_KEY=$DOCUFLOW_S3_SECRET_KEY
          pytest tests/test_storage.py tests/test_s3_conformance.py -v --timeout=90
      - name: Measured memory use
        if: always()
        run: docker stats --no-stream --format "table {{.Name}}\t{{.MemUsage}}\t{{.MemPerc}}"
      - name: Service status
        if: always()
        run: $COMPOSE ps --all
      - name: Logs on failure
        if: failure()
        run: $COMPOSE logs --tail=100
