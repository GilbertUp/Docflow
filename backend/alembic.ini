[alembic]
script_location = migrations
file_template = %%(rev)s_%%(slug)s
# The URL comes from DOCUFLOW_MIGRATION_DATABASE_URL. Never put credentials here.

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
