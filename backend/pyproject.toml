[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "docuflow"
version = "0.1.0"
description = "Self-hosted document management and process automation platform"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.13,<2",
  "argon2-cffi>=23.1",
  "authlib>=1.3,<2",
  "boto3>=1.34,<2",
  "celery>=5.4,<6",
  "cryptography>=43",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "packaging>=24",  # kombu's Redis transport imports it without declaring it
  "pillow>=13,<14",
  "prometheus-client>=0.20,<1",
  "pypdfium2>=4.30,<6",
  "pyotp>=2.9,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "redis>=5,<7",
  "sqlalchemy>=2.0.30,<2.1",
  "structlog>=24.4",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "import-linter>=2.0,<3",
  "moto[s3,server]>=5,<6",
  "mypy>=1.11,<2",
  "pip-audit>=2.7,<3",
  "pip-licenses>=5,<6",
  "pytest>=9.0.3,<10",
  "pytest-cov>=5,<8",
  "pytest-timeout>=2.3,<3",
  "ruff>=0.6,<1",
  "boto3-stubs[s3]>=1.34,<2",
]
# Embedded PostgreSQL for machines without Docker. CI uses a real service container.
embedded-pg = ["pgserver>=0.1.4"]

[project.scripts]
docuflow = "docuflow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/docuflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "db: needs PostgreSQL",
  "conformance: runs against a real S3 backend named by DOCUFLOW_TEST_S3_ENDPOINT",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "C4", "PT", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S608"]
"migrations/**" = ["S608"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery.*", "moto.*", "pgserver.*", "pypdfium2.*"]
ignore_missing_imports = true

[tool.importlinter]
root_package = "docuflow"

[[tool.importlinter.contracts]]
name = "Platform must not depend on business modules"
type = "forbidden"
source_modules = ["docuflow.platform"]
forbidden_modules = ["docuflow.modules"]
